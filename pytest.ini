[pytest]
addopts = -v -m "not disruptive and not needs_live_verification"
testpaths = tests 
python_files = test_*.py
markers =
    requires_device: marks tests that require a live, reachable AccuLoad device connection
    disruptive: marks tests that mutate live device state in a way that can break subsequent test runs (e.g. A19's PUSH command, confirmed live to reset the AccuLoad's IP/netmask/gateway to defaults) - excluded by default addopts, run explicitly with `-m disruptive` (optionally combined with `--accumate-device-ip`/re-configuring the device afterward) as part of a deliberate full regression pass
    requires_device_web: marks tests that drive the AccuLoad device's own embedded web HMI (via workflows/accuload_web.py) rather than AccuMate's desktop app - needs both a reachable device and the internal Selenium tools repo checked out
    needs_live_verification: marks tests written from scenarios/regression.md + code-pattern inference alone, without any live AccuMate window interaction yet (e.g. drafted while avoiding focus-stealing UI checks) - control ids/automation ids/dialog titles are best-guess placeholders (see docstring TODOs) and MUST be confirmed/corrected against the real running app before this marker is removed; excluded by default addopts so a routine run never launches a half-verified UI flow
