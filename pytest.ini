[pytest]
addopts = -v -m "not disruptive and not needs_live_verification and not installs_software and not manual and not special_case"
testpaths = tests 
python_files = test_*.py
markers =
    requires_device: marks tests that require a live, reachable AccuLoad device connection
    disruptive: marks tests that mutate live device state in a way that can break subsequent test runs (e.g. A19's PUSH command, confirmed live to reset the AccuLoad's IP/netmask/gateway to defaults) - excluded by default addopts, run explicitly with `-m disruptive` (optionally combined with `--accumate-device-ip`/re-configuring the device afterward) as part of a deliberate full regression pass
    requires_device_web: marks tests that drive the AccuLoad device's own embedded web HMI (via workflows/accuload_web.py) rather than AccuMate's desktop app - needs both a reachable device and the internal Selenium tools repo checked out
    needs_live_verification: marks tests written from scenarios/regression.md + code-pattern inference alone, without any live AccuMate window interaction yet (e.g. drafted while avoiding focus-stealing UI checks) - control ids/automation ids/dialog titles are best-guess placeholders (see docstring TODOs) and MUST be confirmed/corrected against the real running app before this marker is removed; excluded by default addopts so a routine run never launches a half-verified UI flow
    installs_software: marks tests that perform a real install/uninstall of AccuMate via the compiled Inno Setup installer (workflows/installer_workflows.py) - mutates real machine state (Program Files/AppData, registry, Start Menu shortcuts); excluded from default addopts, run explicitly with `-m installs_software` since a routine test run should never silently install/uninstall software on the machine
    manual: marks regression.md scenarios that cannot be automated at all from this repo, or that ARE fully implemented but not yet live-verified against a real device, and so must be run/confirmed by a human tester before removing this marker (e.g. F6 is implemented but awaiting a live run with device access; F8 needs a real firmware file not supplied and a not-yet-built Firmware Update workflow; G1/G4/G5 need a live human check or an elevated Administrator session never yet probed) - always skips with an explanation; excluded from default addopts since there's nothing for pytest to actually run
    special_case: marks regression.md scenarios (B14/C6/D8/E6) that only apply when the physical AccuLoad is deliberately put into an atypical "no file present" state that this repo cannot safely arrange or verify on its own - not part of the standard automated regression pass; run manually against a pre-arranged device only when that scenario specifically needs re-checking
